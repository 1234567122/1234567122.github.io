        // 获取URL参数
        function getUrlParameter(name) {
            name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
            var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
            var results = regex.exec(location.search);
            return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
        }

        // 加载产品详情
        function loadProductDetail() {
            const productId = getUrlParameter('id') || 'creative-container';
            const product = products[productId];
            
            if (product) {
                document.getElementById('productImage').src = product.image;
                document.getElementById('productImage').alt = product.title;
                document.getElementById('productCategory').textContent = product.category;
                document.getElementById('productTitle').textContent = product.title;
                document.getElementById('productDesc').textContent = product.desc;
                
                // 加载产品特点
                const featuresHtml = product.features.map(feature => 
                    `<li>✓ ${feature}</li>`
                ).join('');
                document.getElementById('productFeatures').innerHTML = featuresHtml;
                
                // 加载产品规格
                const specsHtml = product.specs.map(spec => 
                    `<div class="spec-item"><span class="spec-label">${spec.label}：</span><span class="spec-value">${spec.value}</span></div>`
                ).join('');
                document.getElementById('productSpecs').innerHTML = specsHtml;
                
                document.title = product.title + ' - 常州裕达钢结构工程有限公司';
            }
        }

        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', loadProductDetail);
